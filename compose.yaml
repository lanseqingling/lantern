services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lantern
      POSTGRES_PASSWORD: lantern
      POSTGRES_DB: lantern
    ports:
      - "54329:5432"
    volumes:
      - lantern-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lantern -d lantern"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - lantern-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lantern-postgres:
  lantern-redis:
