    <linearGradient id="modeSurface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2b84b" stop-opacity=".11"/><stop offset="1" stop-color="#64c8c8" stop-opacity=".13"/></linearGradient>
    <radialGradient id="aquaGlow"><stop offset="0" stop-color="#64c8c8" stop-opacity=".22"/><stop offset="1" stop-color="#64c8c8" stop-opacity="0"/></radialGradient>

      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="selectionGlowOuterBlur"/>
      <feFlood flood-color="#64c8c8" flood-opacity=".7" result="selectionGlowOuterColor"/>
      <feComposite in="selectionGlowOuterColor" in2="selectionGlowOuterBlur" operator="in" result="selectionGlowOuter"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="selectionGlowInnerBlur"/>

    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="preview" viewBox="0 0 24 24"><path d="M12 21V7"/><path d="m16 12 2 2 4-4"/><path d="M22 6V4a1 1 0 0 0-1-1h-5a4 4 0 0 0-4 4 4 4 0 0 0-4-4H3a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6a1 1 0 0 0 1-1v-1.3"/></symbol>

  <rect width="1600" height="640" fill="url(#background)"/>

  <ellipse cx="110" cy="690" rx="360" ry="270" fill="url(#goldGlow)"/>

      <circle cx="184" cy="165" r="10.5" fill="#f3b83f"/>

    <text x="126" y="338" font-size="60" font-weight="760" letter-spacing="-2.1" fill="#14272d">一盏灯，陪你打磨漫画故事</text>
